  deshacer: "Undo the last thing I noted"
  ayuda: "What I understand"
help: |-
  This is what I understand:
  /citas: your pending appointments
  /medicacion: your medicines, by time of day
  /suplementos: your supplements, by time of day
  /recordatorios: the pending reminders, to cancel them
  /deshacer: undo the last thing I noted from this chat
  /ayuda: this list
  Mention me or reply to one of my messages to talk to me. Voice notes, photos and PDFs always reach me.
help_admin: |-
  For admins:
  /estado: how the bot and its data are doing
  /nuevo: start a fresh conversation with the assistant
  /presentacion: post the introduction
intro: "Hi, I am the household's doctor assistant. I keep your appointments, your medicines and your supplements, I read the lab results you send me and I look up what you ask in medical sources, saying where it comes from and how much evidence there is. I remind you of appointments and of what to prepare for them. What belongs to each of you is theirs: in the group I only talk about what each one raises here."
new_version: "New version running: {version}."
new_version_from: "New version running: {version} (was {previous})."

