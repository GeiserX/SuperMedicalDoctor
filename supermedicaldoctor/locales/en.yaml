# English strings: the source. Other locales carry the same keys; a missing key falls back here.

# --- free text, voice notes, photos and files ----------------------------------------------
no_ai: "Right now I cannot read written messages; as soon as I can, I will read it."
ai_down: "Right now I cannot read written messages. What you wrote stays here and goes with your next message."
file_name: "file"  # a file the assistant sends whose name has no letter left
send_failed: "I could not send you what I had. Can you ask me again?"
ai_busy: "Right now I cannot answer: I have no capacity left for {wait}. Then I answer everything, with no need to repeat anything."
busy_minutes: "about {n} minutes"
busy_hours: "about {n} hours"
voice_echo: "🎤 {text}"
voice_off: "Right now I cannot listen to voice notes. Can you write it to me?"
voice_failed: "I could not make out the voice note. Can you write it to me?"
voice_too_long: "That voice note is too long for me. Can you sum it up in writing?"
file_too_big: "That file is too big for me (up to 20 MB). Can you send me a photo of the page?"
file_failed: "I could not download that file. Can you send it again?"
later_failed: "I could not finish what I was doing. Ask me again later."
not_for_you: "This is only for the people of this household."

