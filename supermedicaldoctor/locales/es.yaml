intro: "Hola, soy el asistente médico de la casa. Llevo vuestras citas, vuestra medicación y vuestros suplementos, leo los análisis que me mandéis y busco lo que me preguntéis en fuentes médicas, diciendo de dónde sale y cuánta evidencia hay. Os recuerdo las citas y lo que haya que preparar. Lo de cada uno es suyo: en el grupo solo hablo de lo que cada uno saque aquí."

